name: ci

# Validate, never publish. A pull request must be able to prove itself, and must not
# be able to release anything.
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # The example compiles against the library as this repository has it, so the
      # preset seam cannot rot.
      - run: npm run typecheck:examples
      - run: npm test
      - run: npm run build

      - name: the package contains what it promises
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt

          # The two entry points a consumer gets, and nothing from the test suite.
          grep -q 'dist/cli/index.js' pack.txt || { echo "missing dist/cli/index.js"; exit 1; }
          grep -q 'dist/index.js' pack.txt || { echo "missing dist/index.js"; exit 1; }
          if grep -qE '^\s*npm notice [0-9.]+k?B test/' pack.txt; then
            echo "the tarball contains the test suite"
            exit 1
          fi

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: build the image the CLI will run
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          # A shell variable in this step, because $GITHUB_ENV only reaches later
          # steps â€” using it here is how this tag once became ":ci".
          image="ghcr.io/${owner}/stubbing-server"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          docker build --build-arg VERSION=ci -t "${image}:ci" .

      # The CLI is the interface, so CI starts the stub through the CLI rather than
      # through docker directly. If the arguments are wrong, this is where it shows.
      - name: the CLI starts, seeds and stops a real container
        run: |
          mkdir -p stubs
          cat > stubs/partner.json <<'JSON'
          [
            { "method": "GET", "path": "/v1/ping", "status": 200, "body": { "pong": true } },
            { "method": "GET", "path": "/v1/missing", "status": 404, "times": 1 }
          ]
          JSON
          cat > stubbing.config.json <<'JSON'
          { "port": 4010, "containerName": "ci-stub", "mocksPath": "./stubs" }
          JSON

          node dist/cli/index.js start --image "${IMAGE}" --image-tag ci --no-pull
          test "$(curl -fsS http://127.0.0.1:4010/v1/ping)" = '{"pong":true}'
          test "$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:4010/v1/missing)" = '404'
          node dist/cli/index.js status
          node dist/cli/index.js stop --remove

      - name: always stop the container
        if: always()
        run: docker rm -f ci-stub || true
